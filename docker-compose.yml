services:
  app:
    build:
      context: .
      args:
        # Build-time flag: enable the cloud-sync toggle in the client bundle.
        NEXT_PUBLIC_CLOUD_STORAGE_ENABLED: "true"
    ports:
      - "3000:3000"
    # Runtime secrets come from your local .env (gitignored, never in the image).
    env_file:
      - .env
    restart: unless-stopped
